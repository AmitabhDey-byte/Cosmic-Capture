name: Verify Stellar Arena

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  fastapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q backend
      - run: python -c "from backend.app.main import app; assert app.title == 'Stellar Arena API'; assert any(getattr(route, 'path', None) == '/api/players/upsert' and 'POST' in getattr(route, 'methods', set()) for route in app.routes)"
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stellar_arena
          ADMIN_ACCESS_TOKEN: ci-smoke-token

  soroban-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # soroban-sdk 27 requires Rust 1.84+ and the constrained WASM target.
          targets: wasm32v1-none
      - run: cargo fmt --manifest-path contracts/stellar-arena/Cargo.toml -- --check
      - run: cargo test --manifest-path contracts/stellar-arena/Cargo.toml
      - run: cargo build --manifest-path contracts/stellar-arena/Cargo.toml --target wasm32v1-none --release
