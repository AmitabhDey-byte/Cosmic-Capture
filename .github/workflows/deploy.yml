name: Deploy Production

on:
  workflow_run:
    workflows: [Verify Stellar Arena]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-vercel
  cancel-in-progress: false

jobs:
  release-production:
    runs-on: ubuntu-latest
    environment: production
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'master')
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      STELLAR_CONTRACT_DEPLOYER_SECRET: ${{ secrets.STELLAR_CONTRACT_DEPLOYER_SECRET }}
      STELLAR_CONTRACT_ADMIN_ADDRESS: ${{ secrets.STELLAR_CONTRACT_ADMIN_ADDRESS }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate release credentials
        run: |
          test -n "$VERCEL_TOKEN" || (echo "Missing VERCEL_TOKEN repository secret" && exit 1)
          test -n "$VERCEL_ORG_ID" || (echo "Missing VERCEL_ORG_ID repository secret" && exit 1)
          test -n "$VERCEL_PROJECT_ID" || (echo "Missing VERCEL_PROJECT_ID repository secret" && exit 1)
          test -n "$STELLAR_CONTRACT_DEPLOYER_SECRET" || (echo "Missing STELLAR_CONTRACT_DEPLOYER_SECRET GitHub secret" && exit 1)
          test -n "$STELLAR_CONTRACT_ADMIN_ADDRESS" || (echo "Missing STELLAR_CONTRACT_ADMIN_ADDRESS GitHub secret" && exit 1)
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - name: Build Soroban release WASM
        run: cargo build --manifest-path contracts/stellar-arena/Cargo.toml --target wasm32v1-none --release
      - name: Install Stellar CLI
        uses: stellar/stellar-cli@v26.1.0
      - name: Deploy and initialize Soroban contract on Testnet
        id: contract
        shell: bash
        run: |
          contract_id="$(stellar contract deploy \
            --wasm contracts/stellar-arena/target/wasm32v1-none/release/stellar_arena.wasm \
            --source-account "$STELLAR_CONTRACT_DEPLOYER_SECRET" \
            --network testnet | tail -n 1)"
          [[ "$contract_id" =~ ^C[A-Z2-7]{55}$ ]] || (echo "Stellar CLI did not return a valid contract ID" && exit 1)
          stellar contract invoke \
            --id "$contract_id" \
            --source-account "$STELLAR_CONTRACT_DEPLOYER_SECRET" \
            --network testnet \
            -- initialize --admin "$STELLAR_CONTRACT_ADMIN_ADDRESS"
          echo "contract_id=$contract_id" >> "$GITHUB_OUTPUT"
          echo "STELLAR_CONTRACT_ID=$contract_id" >> "$GITHUB_ENV"
          echo "### Soroban Testnet contract: \`$contract_id\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Create fresh Vercel production deployment
        id: deploy
        run: |
          url="$(npx vercel@latest deploy --prod --force --yes --token="$VERCEL_TOKEN" --build-env "VITE_SOROBAN_CONTRACT_ID=$STELLAR_CONTRACT_ID")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed $url"
          echo "### Vercel production URL: $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify production health
        run: curl --fail --retry 5 --retry-delay 4 --retry-connrefused "${{ steps.deploy.outputs.url }}/api/health"
